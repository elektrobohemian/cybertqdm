name: Publish

on:
  push:
    tags: ["v*"] # e.g. v0.2.0 → PyPI
  workflow_dispatch: # manual start → TestPyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(uv version --short)
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || {
            echo "Tag ${GITHUB_REF_NAME} != pyproject version $VERSION"; exit 1; }

      - run: uv build --no-sources

      - name: Smoke test
        run: |
          cd /tmp
          uv run --with "$GITHUB_WORKSPACE"/dist/*.whl --no-project \
            -- python -c "import cybertqdm; print(cybertqdm.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-cybertqdm:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: cybertqdm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4 # uv publish --index needs pyproject.toml
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: uv publish --index cybertqdm

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: uv publish
